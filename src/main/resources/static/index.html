<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Graph Job Matcher</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; margin: 40px; background: #f4f6f9; }
        .container { max-width: 800px; margin: auto; background: white; padding: 30px; border-radius: 8px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
        button { padding: 10px 18px; background: #007bff; color: white; border: none; border-radius: 4px; cursor: pointer; font-size: 14px; }
        .card { border: 1px solid #e1e4e8; padding: 15px; margin-top: 15px; border-radius: 6px; }
    </style>
</head>
<body>
    <div class="container">
        <h2>Job & Skill Recommendation System</h2>
        <p>User: <strong>Alice (ID: u101)</strong></p>
        <button onclick="getJobs()">Fetch Recommended Jobs (2-Hop Traversal)</button>
        
        <div id="status"></div>
        <div id="results"></div>
    </div>

    <script>
        async function getJobs() {
            document.getElementById('status').innerText = 'Traversing CognoDB Graph...';
            const res = await fetch('/api/recommendations/jobs/u101');
            const data = await res.json();
            document.getElementById('status').innerText = '';
            
            let html = '';
            data.forEach(job => {
                html += `<div class="card">
                    <h3>${job.jobTitle}</h3>
                    <p>Matching Skills Count: ${job.matchingSkillsCount}</p>
                </div>`;
            });
            document.getElementById('results').innerHTML = html;
        }
    </script>
</body>
</html>
